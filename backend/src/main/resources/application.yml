spring:
  application:
    name: app-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: app_user
    password: app_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  web:
    cors:
      allowed-origins: "http://localhost:5173"
      allowed-methods: "*"
      allowed-headers: "*"
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

server:
  port: 8080

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:your_account_sid}
  auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token}
  phone-number: ${TWILIO_PHONE_NUMBER:your_phone_number}

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY:your_stripe_api_key}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:your_webhook_secret}

# Application settings
app:
  mail:
    from: ${MAIL_FROM:no-reply@app.local}
  audit:
    enabled: true          # toggles the AuditAspect (quality requirement #7)
  dev: 
    organizer-id: 00000000-0000-0000-0000-000000000001
    attendee-id:  00000000-0000-0000-0000-000000000002
  jwt:
    # JWT secret used for HS256 signing. For local development this can be
    # overridden with the APP_JWT_SECRET environment variable. Must be at
    # least 32 bytes long.
    secret: ${APP_JWT_SECRET:dev_jwt_secret_abcdefghijklmnopqrstuvwxyz_123456}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.example: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.core: DEBUG
